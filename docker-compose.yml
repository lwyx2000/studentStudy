# 小树成长岛 (studentStudy) Docker Compose 编排
#
# 说明：
# - SRC_DIR 用于指定代码目录：本地运行留空(默认 .)，服务器部署时 .env 中设为 ./src
# - 参考 akshare-docker 的三容器架构：backend + frontend(构建产物 volume) + nginx
services:
  # ==================== 后端 API ====================
  backend:
    build:
      context: ${SRC_DIR:-.}/careless-correction-api
      dockerfile: Dockerfile
    image: studentstudy-backend:latest
    container_name: studentstudy-backend
    restart: unless-stopped
    # 后端仅监听本机回环地址，不直接对外暴露，统一由 nginx 反向代理
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    environment:
      - TZ=Asia/Shanghai
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - DB_PATH=/app/data/app.db
      - UPLOAD_DIR=/app/uploads
      - LLM_ENDPOINT=${LLM_ENDPOINT:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
    volumes:
      # SQLite 数据库与上传文件持久化（容器重建/升级不丢失）
      - app_data:/app/data
      - app_uploads:/app/uploads
    networks:
      - studentstudy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==================== 前端构建服务 ====================
  frontend:
    build:
      context: ${SRC_DIR:-.}/careless-correction
      dockerfile: Dockerfile
    image: studentstudy-frontend:latest
    container_name: studentstudy-frontend
    restart: "no"
    volumes:
      - frontend-dist:/app/dist
    environment:
      - TZ=Asia/Shanghai

  # ==================== Nginx 反向代理 ====================
  nginx:
    image: nginx:alpine
    container_name: studentstudy-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8061}:80"
    volumes:
      - ${SRC_DIR:-.}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend-dist:/var/www/html:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    networks:
      - studentstudy-network

networks:
  studentstudy-network:
    driver: bridge
    name: studentstudy-network

volumes:
  frontend-dist:
    name: studentstudy-frontend-dist
  app_data:
    name: studentstudy-app-data
  app_uploads:
    name: studentstudy-app-uploads
