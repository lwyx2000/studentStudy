# 小树成长岛 Nginx 配置
# 静态前端 + /api 与 /uploads 反向代理到后端
events {
    worker_connections 1024;
}

http {
    sendfile off;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # gzip：前端 JS/CSS 包体积大，压缩后能省 70% 左右流量，
    # 弱网/Pad 上首屏加载明显更快（之前完全没开）
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # 请求行上限（打卡清单等参数走 body，这里只做兜底）
    large_client_header_buffers 4 16k;

    # 后端服务（docker-compose 网络内通过服务名访问）
    upstream backend {
        server backend:3001;
    }

    server {
        listen 80;
        server_name _;

        # 错题/打卡图片上传，放宽请求体大小
        client_max_body_size 20m;

        # 健康检查（不经过后端）
        location /health {
            access_log off;
            add_header 'Content-Type' 'text/plain';
            return 200 "healthy\n";
        }

        # 前端 SPA（index.html 禁止缓存，确保每次都拉到最新版本）
        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # 前端构建产物（带 hash，可长缓存）
        location /assets/ {
            root /var/www/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # favicon 也禁缓存
        location = /favicon.svg {
            root /var/www/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # API 反向代理
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 60s;
        }

        # 上传文件（错题照片、任务完成照片）
        location /uploads/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # FastAPI 文档：后端已默认关闭（ENABLE_API_DOCS=false），
        # 这里直接 404，避免接口结构对外暴露
        location ~ ^/(docs|redoc|openapi\.json) {
            return 404;
        }

        # 安全响应头（同源部署，无需 CORS 头）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
